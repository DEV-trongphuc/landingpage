    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const grid = document.getElementById("ideas_news_grid");
            const featuredContainer = document.getElementById("ideas_featured_news");
            const paginationContainer = document.getElementById("ideas_pagination");
            const searchInput = document.getElementById("ideas_news_search");
            const searchLoader = document.querySelector(".ideas_search_loader");
            const searchDropdown = document.getElementById("ideas_search_dropdown");

            let currentPage = 1;
            let currentSearchQuery = "";
            let totalPages = 1;
            let searchTimeout = null;

            // WordPress API base URL
            const API_BASE = "https://ideas.edu.vn/wp-json/wp/v2/posts";
            const PER_PAGE = 12;

            // Extract image from post securely
            const getPostImage = (post) => {
                let thumb = 'https://ideas.edu.vn/wp-content/uploads/2025/07/ideas_side2.webp';
                if (post._embedded && post._embedded['wp:featuredmedia'] && post._embedded['wp:featuredmedia'][0]) {
                    const mediaDetails = post._embedded['wp:featuredmedia'][0].media_details;
                    if (mediaDetails && mediaDetails.sizes && mediaDetails.sizes.medium_large) {
                        thumb = mediaDetails.sizes.medium_large.source_url;
                    } else {
                        thumb = post._embedded['wp:featuredmedia'][0].source_url;
                    }
                }
                return thumb;
            };

            // Function to generate skeletons
            const renderSkeletons = (isFirstPageAndNoSearch) => {
                let gridHtml = "";
                featuredContainer.style.display = "none";
                featuredContainer.innerHTML = "";

                if (isFirstPageAndNoSearch) {
                    featuredContainer.style.display = "grid";
                    featuredContainer.innerHTML = `
                        <div class="ideas_skeleton sk_feat_main"></div>
                        <div class="sk_feat_side">
                            <div class="ideas_skeleton sk_feat_side_item"></div>
                            <div class="ideas_skeleton sk_feat_side_item"></div>
                            <div class="ideas_skeleton sk_feat_side_item"></div>
                        </div>
                    `;
                    for (let i = 0; i < (PER_PAGE - 4); i++) {
                        gridHtml += `
                            <div class="sk_card">
                                <div class="ideas_skeleton sk_thumb"></div>
                                <div class="sk_content">
                                    <div class="ideas_skeleton sk_title"></div>
                                    <div class="ideas_skeleton sk_text"></div>
                                    <div class="ideas_skeleton sk_text"></div>
                                </div>
                            </div>
                        `;
                    }
                } else {
                    for (let i = 0; i < PER_PAGE; i++) {
                        gridHtml += `
                            <div class="sk_card">
                                <div class="ideas_skeleton sk_thumb"></div>
                                <div class="sk_content">
                                    <div class="ideas_skeleton sk_title"></div>
                                    <div class="ideas_skeleton sk_text"></div>
                                    <div class="ideas_skeleton sk_text"></div>
                                </div>
                            </div>
                        `;
                    }
                }
                grid.innerHTML = gridHtml;
            };

            // Fetch and render posts for main view
            const fetchPosts = async (page = 1, search = "") => {
                const isFirstPageAndNoSearch = (page === 1 && !search);
                renderSkeletons(isFirstPageAndNoSearch);

                try {
                    let url = `${API_BASE}?_embed&per_page=${PER_PAGE}&page=${page}&_fields=id,date,title,link,excerpt,_links,_embedded`;
                    if (search) {
                        url += `&search=${encodeURIComponent(search)}`;
                    }

                    const response = await fetch(url);
                    if (!response.ok) {
                        if (response.status === 400) {
                            grid.innerHTML = `<div class="ideas_no_results">Không có bài viết nào ở trang này.</div>`;
                            paginationContainer.innerHTML = "";
                            featuredContainer.style.display = "none";
                            return;
                        }
                        throw new Error("Failed to fetch posts");
                    }

                    totalPages = parseInt(response.headers.get("X-WP-TotalPages")) || 1;
                    const posts = await response.json();

                    if (posts.length === 0) {
                        grid.innerHTML = `<div class="ideas_no_results">Không tìm thấy bài viết nào phù hợp.</div>`;
                        paginationContainer.innerHTML = "";
                        featuredContainer.style.display = "none";
                    } else {
                        if (isFirstPageAndNoSearch && posts.length >= 4) {
                            renderMagazineLayout(posts);
                        } else {
                            featuredContainer.style.display = "none";
                            renderGridOnly(posts);
                        }
                        renderPagination(page, totalPages);
                    }
                } catch (error) {
                    console.error("Error fetching posts:", error);
                    grid.innerHTML = `<div class="ideas_no_results">Đã xảy ra lỗi khi tải bài viết. Vui lòng thử lại sau.</div>`;
                    featuredContainer.style.display = "none";
                }
            };

            // Fetch search results for dropdown
            const fetchSearchResults = async (query) => {
                searchLoader.style.display = "inline-block";
                try {
                    const url = `${API_BASE}?_embed&per_page=5&search=${encodeURIComponent(query)}&_fields=id,date,title,link,excerpt,_links,_embedded`;
                    const response = await fetch(url);
                    if (!response.ok) throw new Error("Search failed");

                    const totalPosts = parseInt(response.headers.get("X-WP-Total")) || 0;
                    const posts = await response.json();

                    renderSearchDropdown(posts, query, totalPosts);
                } catch (error) {
                    console.error("Search error:", error);
                    searchDropdown.innerHTML = `<div class="ideas_search_results"><div class="ideas_search_empty">Đã xảy ra lỗi khi tìm kiếm.</div></div>`;
                    searchDropdown.style.display = "flex";
                } finally {
                    searchLoader.style.display = "none";
                }
            };

            // Render Search Dropdown
            const renderSearchDropdown = (posts, query, totalPosts) => {
                if (posts.length === 0) {
                    searchDropdown.innerHTML = `<div class="ideas_search_results"><div class="ideas_search_empty">Không tìm thấy kết quả nào cho "${query}".</div></div>`;
                    searchDropdown.style.display = "flex";
                    return;
                }

                let html = `<div class="ideas_search_results">`;
                posts.forEach(post => {
                    const title = post.title.rendered;
                    const link = post.link;
                    const date = new Date(post.date).toLocaleDateString('vi-VN', { day: '2-digit', month: '2-digit', year: 'numeric' });
                    const thumb = getPostImage(post);

                    html += `
                        <a href="${link}" class="ideas_search_item" target="_blank">
                            <div class="ideas_search_item_thumb">
                                <img src="${thumb}" alt="${title}">
                            </div>
                            <div class="ideas_search_item_info">
                                <div class="ideas_search_item_title">${title}</div>
                                <div class="ideas_search_item_date">${date}</div>
                            </div>
                        </a>
                    `;
                });
                html += `</div>`;

                if (totalPosts > 5) {
                    html += `<div class="ideas_search_more" onclick="showAllResults('${query.replace(/'/g, "\\'")}')">Xem tất cả ${totalPosts} kết quả cho "${query}" <i class="fa-solid fa-arrow-right"></i></div>`;
                }

                searchDropdown.innerHTML = html;
                searchDropdown.style.display = "flex";
            };

            // Global function to show all results from dropdown
            window.showAllResults = (query) => {
                searchDropdown.style.display = "none";
                searchInput.value = query;
                currentSearchQuery = query;
                currentPage = 1;
                fetchPosts(1, query);
                document.querySelector(".ideas_text_title").scrollIntoView({ behavior: 'smooth', block: 'start' });
            };

            // Render Magazine Layout
            const renderMagazineLayout = (posts) => {
                const mainPost = posts[0];
                const sidePosts = posts.slice(1, 4);
                const gridPosts = posts.slice(4);

                featuredContainer.style.display = "grid";

                const mTitle = mainPost.title.rendered;
                const mExcerpt = mainPost.excerpt.rendered.replace(/<[^>]*>/g, '').substring(0, 150) + "...";
                const mImg = getPostImage(mainPost);

                let featHtml = `
                    <a href="${mainPost.link}" class="featured_main_card" target="_blank">
                        <img src="${mImg}" alt="${mTitle}">
                        <div class="overlay"></div>
                        <div class="featured_main_content">
                            <span class="featured_badge">Tin mới nhất</span>
                            <h2 class="featured_main_title">${mTitle}</h2>
                            <p class="featured_main_excerpt">${mExcerpt}</p>
                        </div>
                    </a>
                    <div class="featured_side_list">
                `;

                sidePosts.forEach(post => {
                    const sTitle = post.title.rendered;
                    const sDate = new Date(post.date).toLocaleDateString('vi-VN', { day: '2-digit', month: '2-digit', year: 'numeric' });
                    const sImg = getPostImage(post);

                    featHtml += `
                        <a href="${post.link}" class="featured_side_item" target="_blank">
                            <div class="featured_side_thumb">
                                <img src="${sImg}" alt="${sTitle}" loading="lazy">
                            </div>
                            <div class="featured_side_info">
                                <div class="featured_side_date">${sDate}</div>
                                <h3 class="featured_side_title">${sTitle}</h3>
                            </div>
                        </a>
                    `;
                });

                featHtml += `</div>`;
                featuredContainer.innerHTML = featHtml;

                renderGridOnly(gridPosts);
            };

            // Render Grid
            const renderGridOnly = (posts) => {
                grid.innerHTML = posts.map(post => {
                    const title = post.title.rendered;
                    const link = post.link;
                    const excerpt = post.excerpt.rendered.replace(/<[^>]*>/g, '').substring(0, 120) + "...";
                    const date = new Date(post.date).toLocaleDateString('vi-VN', { day: '2-digit', month: '2-digit', year: 'numeric' });
                    const thumb = getPostImage(post);

                    return `
                        <a href="${link}" class="ideas_news_card" target="_blank">
                            <div class="ideas_news_thumb">
                                <img src="${thumb}" alt="${title}" loading="lazy">
                                <span class="ideas_news_date">${date}</span>
                            </div>
                            <div class="ideas_news_content">
                                <h3 class="ideas_news_title">${title}</h3>
                                <p class="ideas_news_excerpt">${excerpt}</p>
                                <span class="ideas_news_readmore">Đọc tiếp <i class="fa-solid fa-arrow-right"></i></span>
                            </div>
                        </a>
                    `;
                }).join("");
            };

            // Render Pagination
            const renderPagination = (current, total) => {
                if (total <= 1) {
                    paginationContainer.innerHTML = "";
                    return;
                }

                let html = "";

                html += `<button class="ideas_page_btn" data-page="${current - 1}" ${current === 1 ? 'disabled' : ''}><i class="fa-solid fa-angle-left"></i></button>`;

                let startPage = Math.max(1, current - 1);
                let endPage = Math.min(total, current + 1);

                if (current === 1) endPage = Math.min(total, 3);
                if (current === total) startPage = Math.max(1, total - 2);

                if (startPage > 1) {
                    html += `<button class="ideas_page_btn" data-page="1">1</button>`;
                    if (startPage > 2) html += `<span style="color:#999;">...</span>`;
                }

                for (let i = startPage; i <= endPage; i++) {
                    html += `<button class="ideas_page_btn ${i === current ? 'active' : ''}" data-page="${i}">${i}</button>`;
                }

                if (endPage < total) {
                    if (endPage < total - 1) html += `<span style="color:#999;">...</span>`;
                    html += `<button class="ideas_page_btn" data-page="${total}">${total}</button>`;
                }

                html += `<button class="ideas_page_btn" data-page="${current + 1}" ${current === total ? 'disabled' : ''}><i class="fa-solid fa-angle-right"></i></button>`;

                paginationContainer.innerHTML = html;
            };

            // Listeners
            paginationContainer.addEventListener("click", (e) => {
                const btn = e.target.closest(".ideas_page_btn");
                if (!btn || btn.disabled || btn.classList.contains("active")) return;

                const newPage = parseInt(btn.getAttribute("data-page"));
                if (newPage && newPage !== currentPage) {
                    currentPage = newPage;
                    fetchPosts(currentPage, currentSearchQuery);
                    document.querySelector(".ideas_text_title").scrollIntoView({ behavior: 'smooth', block: 'start' });
                }
            });

            searchInput.addEventListener("input", (e) => {
                clearTimeout(searchTimeout);
                const query = e.target.value.trim();

                if (!query) {
                    searchDropdown.style.display = "none";
                    if (currentSearchQuery !== "") {
                        currentSearchQuery = "";
                        currentPage = 1;
                        fetchPosts(1, "");
                    }
                    return;
                }

                searchTimeout = setTimeout(() => {
                    fetchSearchResults(query);
                }, 500);
            });

            // Close dropdown if clicking outside
            document.addEventListener("click", (e) => {
                if (!e.target.closest(".ideas_search_container")) {
                    searchDropdown.style.display = "none";
                }
            });

            // Re-open dropdown when clicking search input if it has value
            searchInput.addEventListener("focus", () => {
                if (searchInput.value.trim() && searchDropdown.innerHTML !== "") {
                    searchDropdown.style.display = "flex";
                }
            });

            // Initial Fetch
            fetchPosts(currentPage, currentSearchQuery);
        });
    </script>
</div>
